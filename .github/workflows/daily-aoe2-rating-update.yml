name: Daily AoE2 Rating Update

on:
  schedule:
    # Run daily at 04:00 UTC (11:00 Indo China Time)
    # Note: GitHub Actions can delay scheduled workflows by up to 30 minutes
    - cron: '0 4 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache-dependency-path: data2_daominah/aoego/go.sum

    - name: Install dependencies
      working-directory: data2_daominah/aoego
      run: go mod download

    - name: Checkout GitHub Pages repository
      uses: actions/checkout@v4
      with:
        repository: aoe2rating/aoe2rating.github.io
        token: ${{ secrets.GH_PAGES_AOE2RATING_TOKEN }}
        path: gh-pages

    - name: Copy existing data from GitHub Pages to preserve old dates
      run: |
        # Copy existing data directories from GitHub Pages to preserve historical data
        # Only copy if directories exist in GitHub Pages
        if [ -d "gh-pages/data_lite" ]; then
          mkdir -p data2_daominah/aoego/z_aoe2_rating_percentile/data_lite
          cp -r gh-pages/data_lite/* data2_daominah/aoego/z_aoe2_rating_percentile/data_lite/ 2>/dev/null || true
        fi
        if [ -d "gh-pages/data_summarized" ]; then
          mkdir -p data2_daominah/aoego/z_aoe2_rating_percentile/data_summarized
          cp -r gh-pages/data_summarized/* data2_daominah/aoego/z_aoe2_rating_percentile/data_summarized/ 2>/dev/null || true
        fi
        if [ -d "gh-pages/output_charts" ]; then
          mkdir -p data2_daominah/aoego/z_aoe2_rating_percentile/output_charts
          cp -r gh-pages/output_charts/* data2_daominah/aoego/z_aoe2_rating_percentile/output_charts/ 2>/dev/null || true
        fi

    - name: Run rating percentile generator
      working-directory: data2_daominah/aoego/z_aoe2_rating_percentile
      run: go run z_aoe2_rating_percentile.go

    - name: Copy generated files to GitHub Pages
      run: |
        # Copy index.html (always update the main page)
        cp data2_daominah/aoego/z_aoe2_rating_percentile/index.html gh-pages/

        # Copy only non-existing files from output_charts directory
        mkdir -p gh-pages/output_charts
        find data2_daominah/aoego/z_aoe2_rating_percentile/output_charts -type f | while read src_file; do
          dest_file="gh-pages/output_charts/$(basename "$src_file")"
          if [ ! -f "$dest_file" ]; then
            cp "$src_file" "$dest_file"
            echo "Copied new file: $(basename "$src_file")"
          fi
        done

        # Copy only non-existing files from data_lite directory
        mkdir -p gh-pages/data_lite
        find data2_daominah/aoego/z_aoe2_rating_percentile/data_lite -type f | while read src_file; do
          dest_file="gh-pages/data_lite/$(basename "$src_file")"
          if [ ! -f "$dest_file" ]; then
            cp "$src_file" "$dest_file"
            echo "Copied new file: $(basename "$src_file")"
          fi
        done

        # Copy only non-existing files from data_summarized directory
        mkdir -p gh-pages/data_summarized
        find data2_daominah/aoego/z_aoe2_rating_percentile/data_summarized -type f | while read src_file; do
          dest_file="gh-pages/data_summarized/$(basename "$src_file")"
          if [ ! -f "$dest_file" ]; then
            cp "$src_file" "$dest_file"
            echo "Copied new file: $(basename "$src_file")"
          fi
        done

    - name: Clean up old files using retention strategy
      working-directory: gh-pages
      run: |
        python ../data2_daominah/aoego/z_aoe2_rating_percentile/retain_data_lite.py --execute

    - name: Commit and push to GitHub Pages
      run: |
        cd gh-pages
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html output_charts/ data_lite/ data_summarized/
        if git diff --quiet && git diff --staged --quiet; then
          echo "No changes to commit"
        else
          COMMIT_TIME=$(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M:%S.%3N %:z')
          git commit -m "Auto update from daominah/age_of_empires_ror_hd at $COMMIT_TIME"
          git push
        fi

    - name: Print deployment link
      run: |
        echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "View the updated site at https://aoe2rating.github.io and updated data at https://github.com/aoe2rating/aoe2rating.github.io" >> $GITHUB_STEP_SUMMARY
